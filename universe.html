<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.H.R | 宇宙中枢</title>
    <style>
        /* 消除默认边距，让画布全屏 */
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        #galaxy-canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        /* 顶部标题 */
        #main-title {
            position: absolute; top: 40px; left: 50%; transform: translateX(-50%);
            color: #fff; font-size: 2rem; font-weight: 300; letter-spacing: 10px;
            z-index: 10; pointer-events: none; text-shadow: 0 0 20px rgba(255,255,255,0.5);
        }

        /* 返回主页的按钮 */
        .back-btn {
            position: absolute; top: 40px; left: 50px; color: rgba(255,255,255,0.6);
            text-decoration: none; font-size: 14px; letter-spacing: 2px;
            z-index: 10; transition: 0.3s; border: 1px solid rgba(255,255,255,0.3);
            padding: 8px 20px; border-radius: 20px;
        }
        .back-btn:hover { color: #fff; border-color: #fff; background: rgba(255,255,255,0.1); }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
</head>
<body>

    <a href="index.html" class="back-btn">← 离开宇宙</a>
    <h1 id="main-title">选择你的目标星系</h1>
    <canvas id="galaxy-canvas"></canvas>

    <script>
        console.log("Sober-Galaxy：单文件融合模式已开启，空链接防跳机制已激活！");

        // ==========================================
        // 1. 基础环境设置
        // ==========================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color('#000000'); 

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5.5, 2.5); 

        const renderer = new THREE.WebGLRenderer({
            canvas: document.querySelector('#galaxy-canvas'),
            antialias: true
        });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.enablePan = false;

        const createSoftTexture = () => {
            const canvas = document.createElement('canvas');
            canvas.width = 32; canvas.height = 32;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(16, 16, 0, 16, 16, 16);
            grad.addColorStop(0, 'rgba(255,255,255,1)');
            grad.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = grad; ctx.fillRect(0, 0, 32, 32);
            return new THREE.CanvasTexture(canvas);
        };
        const softTexture = createSoftTexture();

        // ==========================================
        // 2. 🌌 宇宙背景：繁星
        // ==========================================
        let starMaterial;
        const createStars = () => {
            const starGeo = new THREE.BufferGeometry();
            const starCount = 4000; 
            const starPos = new Float32Array(starCount * 3);
            const starPhases = new Float32Array(starCount); 
            
            for (let i = 0; i < starCount; i++) {
                const r = 40 + Math.random() * 60;
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos((Math.random() * 2) - 1);
                starPos[i*3] = r * Math.sin(phi) * Math.cos(theta);
                starPos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
                starPos[i*3+2] = r * Math.cos(phi);
                starPhases[i] = Math.random() * Math.PI * 2; 
            }
            
            starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
            starGeo.setAttribute('aPhase', new THREE.BufferAttribute(starPhases, 1));
            
            starMaterial = new THREE.ShaderMaterial({
                uniforms: { uTime: { value: 0 }, uTexture: { value: softTexture } },
                vertexShader: `
                    attribute float aPhase; varying float vAlpha; uniform float uTime;
                    void main() {
                        vAlpha = 0.3 + 0.7 * abs(sin(uTime * 0.8 + aPhase));
                        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                        gl_PointSize = 5.0; gl_Position = projectionMatrix * mvPosition;
                    }
                `,
                fragmentShader: `
                    uniform sampler2D uTexture; varying float vAlpha;
                    void main() {
                        vec4 texColor = texture2D(uTexture, gl_PointCoord);
                        gl_FragColor = vec4(1.0, 1.0, 1.0, texColor.a * vAlpha);
                    }
                `,
                transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
            });
            scene.add(new THREE.Points(starGeo, starMaterial));
        };
        createStars();

        // ==========================================
        // 3. 🪐 星系制造工厂
        // ==========================================
        const galaxies = []; 
        const hitboxes = []; 

        const createGalaxy = (options) => {
            const { name, x, y, z, count, scale, colorInside, colorOutside, tiltX, tiltZ, link } = options;
            
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(count * 3);
            const colors = new Float32Array(count * 3);
            const cInside = new THREE.Color(colorInside);
            const cOutside = new THREE.Color(colorOutside);
            const gaussianRandom = () => (Math.random() + Math.random() + Math.random() - 1.5) * 0.5;

            for (let i = 0; i < count; i++) {
                const i3 = i * 3; let px, py, pz; let mixedColor = new THREE.Color();
                if (Math.random() < 0.55) {
                    const radius = 2.4 * scale; const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos((Math.random() * 2) - 1);
                    const r = radius * Math.cbrt(Math.random()) + gaussianRandom() * 0.4 * scale; 
                    px = r * Math.sin(phi) * Math.cos(theta); py = r * Math.sin(phi) * Math.sin(theta); pz = r * Math.cos(phi);
                    mixedColor = cInside.clone().lerp(cOutside, Math.random() * 0.4);
                } else {
                    const innerRadius = 3.2 * scale; const outerRadius = 8.0 * scale;
                    const mixRatio = Math.pow(Math.random(), 1.5); 
                    const r = innerRadius + mixRatio * (outerRadius - innerRadius);
                    const theta = Math.random() * Math.PI * 2;
                    const thickness = (1.0 * (1.0 - mixRatio) + 0.1) * scale; 
                    py = gaussianRandom() * thickness * 2.5; px = r * Math.cos(theta); pz = r * Math.sin(theta);
                    mixedColor = cOutside.clone().lerp(cInside, mixRatio * 0.6);
                    const darken = 1.0 - Math.min(Math.abs(py) / thickness, 1.0) * 0.5; mixedColor.multiplyScalar(darken);
                }
                positions[i3] = px; positions[i3 + 1] = py; positions[i3 + 2] = pz;
                colors[i3] = mixedColor.r; colors[i3 + 1] = mixedColor.g; colors[i3 + 2] = mixedColor.b;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            const material = new THREE.PointsMaterial({
                size: 0.05 * Math.max(scale, 0.6), sizeAttenuation: true, depthWrite: false, 
                blending: THREE.AdditiveBlending, vertexColors: true, map: softTexture, transparent: true, opacity: 0.9
            });

            const system = new THREE.Points(geometry, material);
            system.position.set(x, y, z); system.rotation.x = tiltX; system.rotation.z = tiltZ;
            scene.add(system);
            galaxies.push(system);

            // --- 创建隐形碰撞盒 ---
            const hitboxGeo = new THREE.SphereGeometry(3.5 * scale, 16, 16);
            const hitboxMat = new THREE.MeshBasicMaterial({ visible: false }); 
            const hitbox = new THREE.Mesh(hitboxGeo, hitboxMat);
            hitbox.position.set(x, y, z);
            
            hitbox.userData = { name, x, y, z, link, system: system }; 
            scene.add(hitbox);
            hitboxes.push(hitbox);
        };

        // ==========================================
        // 4. 🛸 放置宇宙群落与定义跳转链接
        // ==========================================
        createGalaxy({
            name: '摄影视界', x: 0, y: 0, z: 0, count: 55000, scale: 1.0, 
            colorInside: '#9b59b6', colorOutside: '#f39c12', tiltX: Math.PI * 0.12, tiltZ: Math.PI * 0.05,
            link: 'photography.html'
        });
        createGalaxy({
            name: '动态足迹', x: -15, y: -6, z: -15, count: 35000, scale: 0.6, 
            colorInside: '#00d2ff', colorOutside: '#3a7bd5', tiltX: -Math.PI * 0.1, tiltZ: -Math.PI * 0.15,
            link: '' // ✨ 这里：已经把登录页面的链接删除了，留空！
        });
        createGalaxy({
            name: '代码与热爱', x: 18, y: 8, z: -25, count: 30000, scale: 0.5, 
            colorInside: '#ff416c', colorOutside: '#ff4b2b', tiltX: Math.PI * 0.2, tiltZ: -Math.PI * 0.2,
            link: 'code.html'
        });
        createGalaxy({
            name: '优美旋律', x: -10, y: 14, z: -35, count: 40000, scale: 0.8, 
            colorInside: '#11998e', colorOutside: '#38ef7d', tiltX: Math.PI * 0.05, tiltZ: Math.PI * 0.25,
            link: 'music.html'
        });

        // ==========================================
        // 5. 🚀 射线检测 (Raycaster) 与交互逻辑
        // ==========================================
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        const title = document.getElementById('main-title');
        let hoveredHitbox = null;

        window.addEventListener('pointermove', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        });

        window.addEventListener('click', () => {
            if (hoveredHitbox && controls.enabled) {
                const data = hoveredHitbox.userData;
                
                controls.enabled = false;
                gsap.to(title, {
                    opacity: 0, y: -30, duration: 0.4,
                    onComplete: () => {
                        title.innerText = data.name + " 接入中...";
                        gsap.to(title, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" });
                    }
                });

                gsap.to(controls.target, { x: data.x, y: data.y, z: data.z, duration: 2.5, ease: "power3.inOut" });
                gsap.to(camera.position, {
                    x: data.x, y: data.y + 3.0, z: data.z + 1.0,
                    duration: 2.5, ease: "power3.inOut",
                    onUpdate: () => controls.update(),
                    onComplete: () => {
                        // ✨ 核心修改：如果星系有链接，就跳转；如果没有，就显示建设中，然后把镜头控制权还给你！
                        if (data.link) {
                            window.location.href = data.link; 
                        } else {
                            title.innerText = data.name + " (建设中...)";
                        }
                        controls.enabled = true; // 无论跳不跳，都恢复鼠标控制
                    }
                });
            }
        });

        // ==========================================
        // 6. 动画循环
        // ==========================================
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();
            
            if (starMaterial) starMaterial.uniforms.uTime.value = elapsedTime;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(hitboxes);

            if (hoveredHitbox) {
                gsap.to(hoveredHitbox.userData.system.scale, { x: 1, y: 1, z: 1, duration: 0.4, ease: "power2.out" });
            }

            if (intersects.length > 0) {
                document.body.style.cursor = 'pointer';
                hoveredHitbox = intersects[0].object;
                gsap.to(hoveredHitbox.userData.system.scale, { x: 1.08, y: 1.08, z: 1.08, duration: 0.4, ease: "power2.out" });
            } else {
                document.body.style.cursor = 'default';
                hoveredHitbox = null;
            }

            galaxies.forEach((galaxy, index) => {
                const speed = 0.05 * (index % 2 === 0 ? 1 : -0.8);
                galaxy.rotation.y = elapsedTime * speed;
            });

            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
