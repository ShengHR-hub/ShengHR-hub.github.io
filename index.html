<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.H.R | 进入宇宙</title>
    <style>
        /* ================= 基础重置 ================= */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        
        /* 锁定屏幕，禁止滚动 */
        body { overflow: hidden; background-color: #f9f9f9; }

        /* ================= 极简导航栏 ================= */
        #navbar {
            position: fixed; top: 0; width: 100%; padding: 30px 50px;
            display: flex; justify-content: space-between; align-items: center;
            z-index: 1000; transition: opacity 0.5s ease;
        }
        .logo { font-weight: bold; font-size: 1.2rem; letter-spacing: 2px; color: #111; }
        .nav-right { display: flex; align-items: center; gap: 30px; font-size: 14px; color: #333; }
        .nav-right a { text-decoration: none; color: inherit; transition: 0.3s; }
        .nav-right a:hover { color: #888; }
        .login-btn { border: 1px solid #333; padding: 6px 18px; border-radius: 20px; }

        /* ================= 英雄区域 (底白底黑字) ================= */
        #hero { position: relative; width: 100vw; height: 100vh; display: flex; justify-content: center; align-items: center; }
        
        /* 点阵背景 */
        .bg-dots {
            position: absolute; width: 100%; height: 100%;
            background-image: radial-gradient(#d5d5d5 1px, transparent 1px);
            background-size: 40px 40px; z-index: 1;
        }

        .text-content { text-align: center; position: absolute; z-index: 2; pointer-events: none; }
        h1 { font-size: 5rem; font-weight: 900; letter-spacing: 5px; text-transform: uppercase; color: #111; margin-bottom: 15px; }
        p { font-size: 1.1rem; color: #666; letter-spacing: 2px; }

        /* ================= 黑洞层 (顶层黑底白字) ================= */
        #black-hole {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #111; color: #fff;
            display: flex; justify-content: center; align-items: center; flex-direction: column;
            
            /* 核心魔法：初始状态是一个被裁剪的圆 */
            clip-path: circle(240px at center);
            /* 动画贝塞尔曲线：先慢后极快，模拟被吸入的感觉 */
            transition: clip-path 1.2s cubic-bezier(0.86, 0, 0.07, 1);
            z-index: 10;
        }
        
        /* 触发点击后的展开状态 (圆的半径扩大到足以覆盖整个屏幕) */
        .expand { clip-path: circle(3000px at center) !important; }

        #black-hole h1 { color: #fff; pointer-events: none; }
        #black-hole p { color: #aaa; pointer-events: none; margin-bottom: 40px; }

        /* 进入宇宙的按钮 */
        #enter-btn {
            padding: 12px 36px; border: 1px solid rgba(255,255,255,0.4); border-radius: 30px;
            background: transparent; color: #fff; font-size: 1rem; cursor: pointer;
            transition: all 0.3s ease; letter-spacing: 2px; position: relative; z-index: 20;
        }
        #enter-btn:hover { background: #fff; color: #111; transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.5); }

        /* 通用淡出类 */
        .fade-out { opacity: 0 !important; pointer-events: none; transition: opacity 0.5s ease; }
    </style>
</head>
<body>

    <nav id="navbar">
        <div class="logo">S.H.R</div>
        <div class="nav-right">
            <span>CN / EN</span>
            <a href="login.html" class="login-btn">登录 / 注册</a>
        </div>
    </nav>

    <div id="hero">
        <div class="bg-dots"></div>
        
        <div class="text-content">
            <h1>HELLO, I'M SHR</h1>
            <p>坐标: 西安 | 学生 · 摄影师 · 音乐鉴赏者</p>
        </div>

        <div id="black-hole">
            <h1>你好，我是温水</h1>
            <p>坐标: 西安 | 学生 · 摄影师 · 音乐鉴赏者</p>
            <button id="enter-btn">进入宇宙探索</button>
        </div>
    </div>

    <script>
        const enterBtn = document.getElementById('enter-btn');
        const blackHole = document.getElementById('black-hole');
        const navbar = document.getElementById('navbar');

        enterBtn.addEventListener('click', () => {
            // 1. 隐藏按钮和导航栏，营造沉浸感
            enterBtn.classList.add('fade-out');
            navbar.classList.add('fade-out');
            
            // 2. 触发黑洞吞噬屏幕的动画
            blackHole.classList.add('expand');

            // 3. 等待黑暗完全降临，准备跳转到宇宙页面！
            setTimeout(() => {
                window.location.href = 'universe.html'; 
            }, 1200); // 1.2秒后执行跳转
        });
    </script>

</body>
</html>
