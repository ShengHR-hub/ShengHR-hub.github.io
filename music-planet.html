<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sober Resonance - 音乐星球</title>
    <style>
        /* ================= UI 与 排版 ================= */
        body {
            margin: 0;
            overflow: hidden;
            background-color: #030303; /* 极致的深空黑 */
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            color: #ffffff;
        }

        #ui-container {
            position: absolute;
            z-index: 10;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
            box-sizing: border-box;
        }

        .back-btn {
            pointer-events: auto;
            text-decoration: none;
            color: rgba(255, 255, 255, 0.4);
            font-size: 13px;
            letter-spacing: 2px;
            transition: color 0.3s ease;
        }

        .back-btn:hover {
            color: #ffffff;
        }

        /* 沉浸式启动遮罩 */
        .play-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            transition: opacity 1.5s ease;
        }

        .play-btn {
            cursor: pointer;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.8);
            padding: 16px 40px;
            font-size: 12px;
            letter-spacing: 6px;
            border-radius: 40px;
            transition: all 0.4s ease;
        }

        .play-btn:hover {
            border-color: #ffffff;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
        }

        /* 正在播放信息 */
        .song-info {
            text-align: center;
            font-size: 11px;
            letter-spacing: 4px;
            color: rgba(255, 255, 255, 0.3);
            opacity: 0; /* 默认隐藏，音乐响起时淡入 */
            transition: opacity 2s ease;
            transform: translateY(-20px);
        }

        .song-title {
            color: #ffffff;
            font-size: 16px;
            letter-spacing: 2px;
            margin-top: 10px;
            font-weight: 300;
        }

        canvas {
            display: block;
        }
    </style>
</head>
<body>

    <div id="ui-container">
        <a href="universe.html" class="back-btn">← 返回宇宙中枢</a>
        <div class="song-info" id="song-info">
            NOW RESONATING
            <div class="song-title">病变 - 温水专属</div>
        </div>
    </div>

    <div class="play-overlay" id="play-overlay">
        <button class="play-btn" id="play-btn">INITIATE RESONANCE</button>
    </div>

    <canvas id="webgl-canvas"></canvas>

    <audio id="audio-source" src="music/病变.mp3" crossorigin="anonymous"></audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // ==========================================
        // 1. 基础 3D 场景配置
        // ==========================================
        const canvas = document.getElementById('webgl-canvas');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.02);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 15, 30);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // ==========================================
        // 2. 构建 3D 吸积盘 (粒子星环)
        // ==========================================
        const particleCount = 8000;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const colors = new Float32Array(particleCount * 3);

        const colorInside = new THREE.Color('#3a7bd5'); // 深海蓝
        const colorOutside = new THREE.Color('#9b59b6'); // 淡紫

        for (let i = 0; i < particleCount; i++) {
            // 生成圆环范围内的随机点
            const radius = 8 + Math.random() * 12;
            const theta = Math.random() * Math.PI * 2;
            
            // 粒子坐标
            positions[i * 3] = radius * Math.cos(theta);
            positions[i * 3 + 1] = (Math.random() - 0.5) * (Math.random() * 2); // 扁平的 Y 轴
            positions[i * 3 + 2] = radius * Math.sin(theta);

            // 粒子颜色插值 (内圈偏蓝，外圈偏紫)
            const mixRatio = (radius - 8) / 12;
            const mixedColor = colorInside.clone().lerp(colorOutside, mixRatio);
            colors[i * 3] = mixedColor.r;
            colors[i * 3 + 1] = mixedColor.g;
            colors[i * 3 + 2] = mixedColor.b;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        // 创建发光材质
        const material = new THREE.PointsMaterial({
            size: 0.15,
            vertexColors: true,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const starRing = new THREE.Points(geometry, material);
        // 稍微倾斜星环，更有宇宙吸积盘的感觉
        starRing.rotation.x = Math.PI * 0.15;
        scene.add(starRing);

        // ==========================================
        // 3. Web Audio API 音频解析引擎
        // ==========================================
        let audioContext, analyser, dataArray;
        const audioElement = document.getElementById('audio-source');
        let isResonating = false;

        const initAudio = () => {
            // 初始化音频上下文
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();
            
            // 抓取音乐节点并连接到分析器和扬声器
            const source = audioContext.createMediaElementSource(audioElement);
            source.connect(analyser);
            analyser.connect(audioContext.destination);

            // 设置频率数据采集精度
            analyser.fftSize = 256; 
            const bufferLength = analyser.frequencyBinCount;
            dataArray = new Uint8Array(bufferLength);
        };

        // ==========================================
        // 4. 交互：点燃星球引擎
        // ==========================================
        const playBtn = document.getElementById('play-btn');
        const overlay = document.getElementById('play-overlay');
        const songInfo = document.getElementById('song-info');

        playBtn.addEventListener('click', () => {
            if (!audioContext) initAudio();
            
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
            
            audioElement.play();
            isResonating = true;

            // UI 隐退与淡入
            overlay.style.opacity = '0';
            setTimeout(() => { overlay.style.display = 'none'; }, 1500);
            songInfo.style.opacity = '1';
        });

        // ==========================================
        // 5. 动画循环与引力波频映射
        // ==========================================
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            // 星环的基础自转
            starRing.rotation.y = time * 0.1;

            // 🎵 核心魔法：将音乐频率注入 3D 世界
            if (isResonating && analyser) {
                // 获取当前帧的音乐频率数据 (0-255)
                analyser.getByteFrequencyData(dataArray);

                // 提取低频部分 (Bass/鼓点) 的平均值
                let bassSum = 0;
                const bassRange = 10; // 取前10个频段算重低音
                for (let i = 0; i < bassRange; i++) {
                    bassSum += dataArray[i];
                }
                const averageBass = bassSum / bassRange; 

                // 将低频数值 (0-255) 转化为 3D 缩放比例
                // 鼓点越重，星环瞬间放大越厉害 (引力波震荡)
                const bassScale = 1 + (averageBass / 255) * 0.4; 
                starRing.scale.set(bassScale, 1 + (averageBass / 255) * 0.8, bassScale);
                
                // 颜色亮度随音乐微调
                material.opacity = 0.6 + (averageBass / 255) * 0.4;
            } else {
                // 音乐没播放时，维持极其缓慢的呼吸缩放
                const breath = 1 + Math.sin(time * 2) * 0.02;
                starRing.scale.set(breath, breath, breath);
            }

            renderer.render(scene, camera);
        }

        // 处理屏幕自适应
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
