<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sober Resonance - 音乐星球</title>
    <style>
        /* ================= UI 与 排版 ================= */
        body {
            margin: 0;
            overflow: hidden;
            background-color: #030303; /* 极致的深空黑 */
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            color: #ffffff;
        }

        #ui-container {
            position: absolute;
            z-index: 10;
            width: 100%;
            height: 100%;
            pointer-events: none; /* 让鼠标事件穿透到 3D 画布 */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px;
            box-sizing: border-box;
        }

        .back-btn {
            pointer-events: auto;
            text-decoration: none;
            color: rgba(255, 255, 255, 0.4);
            font-size: 13px;
            letter-spacing: 2px;
            transition: color 0.3s ease;
        }

        .back-btn:hover {
            color: #ffffff;
        }

        /* 沉浸式启动遮罩 */
        .play-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            z-index: 20;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            transition: opacity 1.5s ease;
        }

        .play-btn {
            cursor: pointer;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: rgba(255, 255, 255, 0.8);
            padding: 16px 40px;
            font-size: 12px;
            letter-spacing: 6px;
            border-radius: 40px;
            transition: all 0.4s ease;
        }

        .play-btn:hover {
            border-color: #ffffff;
            color: #ffffff;
            background: rgba(255, 255, 255, 0.05);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.1);
        }

        /* 底部控制区 (包含歌曲信息和按钮) */
        .bottom-panel {
            pointer-events: auto; /* 恢复底部区域的鼠标交互 */
            text-align: center;
            opacity: 0; /* 默认隐藏 */
            transition: opacity 2s ease;
            transform: translateY(-20px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .song-info {
            font-size: 11px;
            letter-spacing: 4px;
            color: rgba(255, 255, 255, 0.3);
        }

        .song-title {
            color: #ffffff;
            font-size: 16px;
            letter-spacing: 2px;
            margin-top: 5px;
            font-weight: 300;
        }

        /* 极简音乐控制按钮 */
        .music-controls {
            display: flex;
            gap: 30px;
            align-items: center;
        }

        .ctrl-btn {
            background: none;
            border: none;
            color: rgba(255, 255, 255, 0.4);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
        }

        .ctrl-btn:hover {
            color: #ffffff;
            transform: scale(1.1);
        }

        .ctrl-btn.play-pause svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }
        .ctrl-btn.skip svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1; /* 置于底层 */
        }
    </style>
</head>
<body>

    <canvas id="webgl-canvas"></canvas>

    <div id="ui-container">
        <a href="universe.html" class="back-btn">← 返回宇宙中枢</a>
        
        <div class="bottom-panel" id="bottom-panel">
            <div class="song-info">
                NOW RESONATING
                <div class="song-title">病变 - 温水专属</div>
            </div>
            
            <div class="music-controls">
                <button class="ctrl-btn skip" id="prev-btn" title="上一首">
                    <svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                </button>
                <button class="ctrl-btn play-pause" id="toggle-btn" title="暂停/播放">
                    <svg id="icon-pause" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
                    <svg id="icon-play" viewBox="0 0 24 24" style="display:none;"><path d="M8 5v14l11-7z"/></svg>
                </button>
                <button class="ctrl-btn skip" id="next-btn" title="下一首">
                    <svg viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                </button>
            </div>
        </div>
    </div>

    <div class="play-overlay" id="play-overlay">
        <button class="play-btn" id="play-btn">INITIATE RESONANCE</button>
    </div>

    <audio id="audio-source" src="music/病变.mp3" crossorigin="anonymous"></audio>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // ==========================================
        // 1. 基础 3D 场景配置
        // ==========================================
        const canvas = document.getElementById('webgl-canvas');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x000000, 0.02);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 15, 30);
        
        const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // 🌟 新增：配置鼠标拖拽缩放控制器
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; // 开启阻尼带来丝滑的拖拽感
        controls.dampingFactor = 0.05;
        controls.maxDistance = 60; // 最远缩放距离
        controls.minDistance = 5;  // 最近缩放距离

        // ==========================================
        // 2. 构建 3D 吸积盘 (粒子星环)
        // ==========================================
        const particleCount = 10000;
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(particleCount * 3);
        const basePositions = new Float32Array(particleCount * 3); // 🌟 存储初始位置，用于计算波浪
        const colors = new Float32Array(particleCount * 3);

        const colorInside = new THREE.Color('#3a7bd5'); // 深海蓝
        const colorOutside = new THREE.Color('#9b59b6'); // 淡紫

        for (let i = 0; i < particleCount; i++) {
            const radius = 8 + Math.random() * 14;
            const theta = Math.random() * Math.PI * 2;
            
            // 计算粒子坐标
            const x = radius * Math.cos(theta);
            const y = (Math.random() - 0.5) * 0.5; // 初始Y轴尽量扁平
            const z = radius * Math.sin(theta);

            positions[i * 3] = x;
            positions[i * 3 + 1] = y;
            positions[i * 3 + 2] = z;

            // 备份初始坐标
            basePositions[i * 3] = x;
            basePositions[i * 3 + 1] = y;
            basePositions[i * 3 + 2] = z;

            // 颜色插值
            const mixRatio = (radius - 8) / 14;
            const mixedColor = colorInside.clone().lerp(colorOutside, mixRatio);
            colors[i * 3] = mixedColor.r;
            colors[i * 3 + 1] = mixedColor.g;
            colors[i * 3 + 2] = mixedColor.b;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const material = new THREE.PointsMaterial({
            size: 0.12,
            vertexColors: true,
            transparent: true,
            opacity: 0.8,
            blending: THREE.AdditiveBlending,
            depthWrite: false
        });

        const starRing = new THREE.Points(geometry, material);
        scene.add(starRing);

        // ==========================================
        // 3. Web Audio API 音频解析
        // ==========================================
        let audioContext, analyser, dataArray;
        const audioElement = document.getElementById('audio-source');
        let isResonating = false;

        const initAudio = () => {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();
            const source = audioContext.createMediaElementSource(audioElement);
            source.connect(analyser);
            analyser.connect(audioContext.destination);

            analyser.fftSize = 256; 
            dataArray = new Uint8Array(analyser.frequencyBinCount);
        };

        // ==========================================
        // 4. UI 交互与按钮控制
        // ==========================================
        const playBtn = document.getElementById('play-btn');
        const overlay = document.getElementById('play-overlay');
        const bottomPanel = document.getElementById('bottom-panel');
        
        // 音乐控制按钮
        const toggleBtn = document.getElementById('toggle-btn');
        const iconPlay = document.getElementById('icon-play');
        const iconPause = document.getElementById('icon-pause');
        const prevBtn = document.getElementById('prev-btn');
        const nextBtn = document.getElementById('next-btn');

        // 启动星球
        playBtn.addEventListener('click', () => {
            if (!audioContext) initAudio();
            if (audioContext.state === 'suspended') audioContext.resume();
            
            audioElement.play();
            isResonating = true;

            overlay.style.opacity = '0';
            setTimeout(() => { overlay.style.display = 'none'; }, 1500);
            bottomPanel.style.opacity = '1';
        });

        // 暂停/播放 切换逻辑
        toggleBtn.addEventListener('click', () => {
            if (audioElement.paused) {
                audioElement.play();
                iconPlay.style.display = 'none';
                iconPause.style.display = 'block';
            } else {
                audioElement.pause();
                iconPause.style.display = 'none';
                iconPlay.style.display = 'block';
            }
        });

        // 上一首/下一首 (目前作为占位符，如果以后你加了多首歌可以在这里写切换路径的逻辑)
        prevBtn.addEventListener('click', () => {
            console.log("上一首：准备接入播放列表逻辑");
            // 提示：可以建一个包含音乐路径的数组，点击时改变 audioElement.src 并 play()
        });
        nextBtn.addEventListener('click', () => {
            console.log("下一首：准备接入播放列表逻辑");
        });

        // ==========================================
        // 5. 动画循环与 🌟 波浪算法核心
        // ==========================================
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            // 保持控制器更新
            controls.update();
            
            // 整体缓慢自转
            starRing.rotation.y = time * 0.05;

            // 获取粒子位置数组
            const posAttribute = geometry.attributes.position;
            const posArray = posAttribute.array;

            if (isResonating && analyser && !audioElement.paused) {
                analyser.getByteFrequencyData(dataArray);

                // 🌟 遍历每个粒子，计算波浪高度
                for (let i = 0; i < particleCount; i++) {
                    const idx = i * 3;
                    const basePathX = basePositions[idx];
                    const basePathY = basePositions[idx + 1];
                    const basePathZ = basePositions[idx + 2];

                    // 计算该粒子距离中心的半径距离
                    const dist = Math.sqrt(basePathX * basePathX + basePathZ * basePathZ);
                    
                    // 将粒子的位置映射到音频频率的索引上 (内圈对应低音，外圈对应高音)
                    const dataIndex = Math.floor((dist - 8) / 14 * (dataArray.length * 0.6)); 
                    const audioValue = dataArray[dataIndex] || 0;

                    // 🌊 核心数学公式：原Y轴 + 正弦波(距离-时间) * 音频强度
                    const waveHeight = Math.sin(dist * 1.5 - time * 3); // 生成向外扩散的水波纹
                    const bounce = (audioValue / 255) * 3; // 音量越大，弹跳越高

                    // 更新该粒子的 Y 轴坐标
                    posArray[idx + 1] = basePathY + waveHeight * bounce;
                }
                
                // 通知 GPU 重新渲染粒子的位置
                posAttribute.needsUpdate = true;
                
                // 随着鼓点整体闪烁呼吸
                material.opacity = 0.5 + (dataArray[2] / 255) * 0.5; 

            } else {
                // 如果暂停了，粒子缓慢恢复平稳
                for (let i = 0; i < particleCount; i++) {
                    const idx = i * 3;
                    // 逐渐回归初始高度，带有极其微弱的静态呼吸
                    posArray[idx + 1] = THREE.MathUtils.lerp(posArray[idx + 1], basePositions[idx + 1] + Math.sin(time + i)*0.1, 0.05);
                }
                posAttribute.needsUpdate = true;
                material.opacity = 0.6;
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
